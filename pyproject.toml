[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entolaw"
version = "1.0.0"
description = "Source-anchored registries and a claim-sourced manuscript mapping registered legal roles of the insect."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "certifi>=2026.7.22",
    "legal_informatics",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0",
    "ruff>=0.13.0",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff.lint]
# Preserve the pre-0.16 default profile explicitly across Ruff releases, and
# keep it identical to the engine's, so a module that lints clean in
# legal_informatics lints clean here too.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Thin orchestrator pattern: every scripts/ file inserts the project root on
# sys.path before importing the engine, so module-level imports follow the
# bootstrap.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "live: hits real external source pages; skip with ENTOLAW_OFFLINE=1",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv.sources]
# Sibling checkout, editable: EntoLaw consumes the generic legal-informatics
# methods engine instead of carrying byte-identical copies of its modules.
legal_informatics = { path = "../legal_informatics", editable = true }
