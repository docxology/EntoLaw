# Per-project extensions to the shared legal_informatics manuscript-variable
# engine.
#
# EntoLaw does not run the engine's full `generate_variables()` pipeline --
# its own `src/manuscript_variables.py` is a separate, project-specific
# generator over the case/statute/species/role registries. It only imports
# small, generic helpers from `legal_informatics.manuscript_variables`
# (currently `receipt_python_version`, for the PYTHON_VERSION token), and
# importing that module unconditionally reads this file at import time via
# `load_manuscript_extensions` -- a missing file is refused rather than
# defaulted, per that module's own docstring, so the absence of extensions
# has to be declared explicitly.
#
# EntoLaw declares no provider and no hand-typed literal here: every token in
# its manuscript is generated by its own `generate_variables()` from its own
# registries, not by this engine's provider/literal system. Both keys are
# present and empty rather than absent -- declaring the absence is the claim.

schema_version: 1

variable_providers: []

literal_tokens: {}
