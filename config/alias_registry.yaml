# Canonical candidate entity alias registry for the EntoLaw insect-law corpus.
#
# Loaded by legal_informatics/alias_registry.py and consumed by
# legal_informatics/corpus_analysis.py. This file is the single source of the
# alias surface forms that produce entity ids, so an id change here is an id
# change in every generated artifact.
#
# An entry groups surface forms observed in the corpus under one candidate id.
# It records how the text is written, never who or what the entity really is:
# nothing here establishes ownership, control, legal effect, legal status of a
# taxon, or person-level fact. Every entity emitted from this registry carries
# review_status: candidate_review_required.
#
# Fields
#   registry_version    Bumped whenever an id, kind, or alias set changes.
#   entities[].id       Stable candidate entity id. Renaming one is a migration.
#   entities[].kind     Entity kind; drives relation direction in corpus_analysis.
#   entities[].label    Canonical display label; also matched as an alias.
#   entities[].aliases  Additional surface forms. Matching is case- and
#                       whitespace-insensitive and longest-alias-first.
#   entities[].audit    Recorded merge and split decisions. Each carries an
#                       action, a rationale, a curation status, and a review
#                       status. Audit rows are curation decisions about this
#                       file, not observations of the corpus.

registry_version: '1.0'
registry_id: entolaw_canonical_entities
review_status: curated_candidate_registry
boundary: >-
  Aliases group surface forms for retrieval and counting. Grouping two strings
  under one id is a reviewable curation decision, never a finding that the two
  strings name the same real-world thing — including two spellings of a
  species name and the legal status of the organism it names.

entities:
# ── Taxa ──────────────────────────────────────────────────────────────────
- id: taxon:apis-mellifera
  kind: taxon
  label: Honey bee (Apis mellifera)
  aliases:
  - Apis mellifera
  - honey bee
  - honeybee
  audit:
  - action: merge
    merged_alias_forms:
    - honeybee
    - honey bee
    rationale: The received texts spell the same taxon with both one-word and two-word
      forms; they are one surface form, not two taxa.
    status: curation_decision
    review_status: human_review_required
- id: taxon:danaus-plexippus
