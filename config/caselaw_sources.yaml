# Declarative registry of case-law sources for legal_informatics.caselaw_acquisition,
# mirroring the citations registered in EntoLaw/src/case_records.py.
#
# Opt-in by construction. Nothing in the engine reads this file on import, and
# nothing here opens a socket: load_source_config() only describes sources
# (offline, credential-free), and bytes move only when
# caselaw_acquisition.fetch_artifact() is called explicitly for one source.
#
# No secrets live here. A provider that needs a key declares only the NAME of
# its environment variable (api_key_env); sources without api_key_env fetch
# anonymously. Where no stable full-text URL is known for a citation, the row
# declares a provider search or index URL and says so in notes — a capture of
# such a row records that the URL served navigation where a holding was
# expected, exactly what the content-form field exists to preserve.
version: '1.0'
sources:
